name: Diagnose imported project

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Diagnose bootstrap parts
        shell: bash
        run: |
          set -u
          echo '=== INDIVIDUAL PARTS ==='
          for p in .bootstrap/overlay.part.*; do
            n="$(basename "$p")"
            out="/tmp/$n.bin"
            echo "--- $n ---"
            echo "text_bytes=$(wc -c < "$p")"
            if base64 --decode "$p" > "$out" 2>/tmp/b64err; then
              echo "base64=ok decoded_bytes=$(wc -c < "$out")"
              printf 'first16='; xxd -p -l 16 "$out" || true
              printf 'last16='; tail -c 16 "$out" | xxd -p || true
              printf 'file='; file -b "$out" || true
              if xz -t "$out" >/tmp/xzout 2>/tmp/xzerr; then
                echo 'xz_test=ok'
              else
                code=$?
                echo "xz_test=fail($code): $(tr '\n' ' ' </tmp/xzerr)"
              fi
            else
              code=$?
              echo "base64=fail($code): $(tr '\n' ' ' </tmp/b64err)"
            fi
          done

          echo '=== CONCATENATED BASE64 ==='
          cat .bootstrap/overlay.part.* > /tmp/all.b64
          echo "text_bytes=$(wc -c < /tmp/all.b64)"
          if base64 --decode /tmp/all.b64 > /tmp/all.bin 2>/tmp/allb64err; then
            echo "base64=ok decoded_bytes=$(wc -c < /tmp/all.bin)"
            printf 'first16='; xxd -p -l 16 /tmp/all.bin || true
            printf 'last16='; tail -c 16 /tmp/all.bin | xxd -p || true
            printf 'file='; file -b /tmp/all.bin || true
            if xz -t /tmp/all.bin >/tmp/allxzout 2>/tmp/allxzerr; then
              echo 'xz_test=ok'
            else
              code=$?
              echo "xz_test=fail($code): $(tr '\n' ' ' </tmp/allxzerr)"
            fi
          else
            code=$?
            echo "base64=fail($code): $(tr '\n' ' ' </tmp/allb64err)"
          fi

          echo '=== CONCATENATED DECODED PARTS ==='
          : > /tmp/decoded-parts.bin
          all_ok=1
          for p in .bootstrap/overlay.part.*; do
            if base64 --decode "$p" >> /tmp/decoded-parts.bin 2>/tmp/partb64err; then
              :
            else
              all_ok=0
              echo "decode failed for $p: $(tr '\n' ' ' </tmp/partb64err)"
            fi
          done
          echo "individual_decode_all_ok=$all_ok decoded_bytes=$(wc -c < /tmp/decoded-parts.bin)"
          printf 'first16='; xxd -p -l 16 /tmp/decoded-parts.bin || true
          printf 'last16='; tail -c 16 /tmp/decoded-parts.bin | xxd -p || true
          printf 'file='; file -b /tmp/decoded-parts.bin || true
          if xz -t /tmp/decoded-parts.bin >/tmp/partsxzout 2>/tmp/partsxzerr; then
            echo 'xz_test=ok'
          else
            code=$?
            echo "xz_test=fail($code): $(tr '\n' ' ' </tmp/partsxzerr)"
          fi
