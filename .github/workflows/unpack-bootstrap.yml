name: Diagnose imported project

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Diagnose bootstrap parts
        shell: bash
        run: |
          set -u
          echo '=== INDIVIDUAL PARTS ==='
          for p in .bootstrap/overlay.part.*; do
            n="$(basename "$p")"
            out="/tmp/$n.bin"
            echo "--- $n ---"
            echo "text_bytes=$(wc -c < "$p")"
            if base64 --decode "$p" > "$out" 2>/tmp/b64err; then
              echo "base64=ok decoded_bytes=$(wc -c < "$out")"
              printf 'first16='; xxd -p -l 16 "$out" || true
              printf 'last16='; tail -c 16 "$out" | xxd -p || true
              printf 'file='; file -b "$out" || true
              if xz -t "$out" >/tmp/xzout 2>/tmp/xzerr; then
                echo 'xz_test=ok'
              else
                code=$?
                echo "xz_test=fail($code): $(tr '\n' ' ' </tmp/xzerr)"
              fi
            else
              code=$?
              echo "base64=fail($code): $(tr '\n' ' ' </tmp/b64err)"
            fi
          done

          echo '=== CONCATENATED PAYLOAD ==='
          cat .bootstrap/overlay.part.* > /tmp/all.b64
          base64 --decode /tmp/all.b64 > /tmp/all.bin
          echo "text_bytes=$(wc -c < /tmp/all.b64) decoded_bytes=$(wc -c < /tmp/all.bin)"
          printf 'first16='; xxd -p -l 16 /tmp/all.bin || true
          printf 'last16='; tail -c 16 /tmp/all.bin | xxd -p || true
          printf 'file='; file -b /tmp/all.bin || true
          if xz -t /tmp/all.bin >/tmp/allxzout 2>/tmp/allxzerr; then
            echo 'xz_test=ok'
          else
            code=$?
            echo "xz_test=fail($code): $(tr '\n' ' ' </tmp/allxzerr)"
          fi

          echo '=== PARTIAL XZ RECOVERY ==='
          rm -f /tmp/partial.out
          if xz -dc /tmp/all.bin > /tmp/partial.out 2>/tmp/partial.err; then
            echo 'xz_decompress=ok'
          else
            code=$?
            echo "xz_decompress=partial/fail($code): $(tr '\n' ' ' </tmp/partial.err)"
          fi
          echo "partial_bytes=$(wc -c < /tmp/partial.out) modulo512=$(( $(wc -c < /tmp/partial.out) % 512 ))"
          printf 'partial_file='; file -b /tmp/partial.out || true
          printf 'partial_first16='; xxd -p -l 16 /tmp/partial.out || true
          printf 'partial_last64='; tail -c 64 /tmp/partial.out | xxd -p || true

          if tar -tf /tmp/partial.out > /tmp/tarlist 2>/tmp/tarerr; then
            tar_rc=0
          else
            tar_rc=$?
          fi
          echo "tar_list_rc=$tar_rc entries=$(wc -l < /tmp/tarlist) error=$(tr '\n' ' ' </tmp/tarerr)"
          echo 'tar_first5:'
          head -n 5 /tmp/tarlist || true
          echo 'tar_last10:'
          tail -n 10 /tmp/tarlist || true

          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/partial.out').read_bytes()
          trailing=0
          for b in reversed(p):
              if b==0: trailing+=1
              else: break
          print(f'trailing_zero_bytes={trailing}')
          PY
